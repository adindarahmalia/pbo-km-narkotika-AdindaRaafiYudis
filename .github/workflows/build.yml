name: Java CI Build

on:
  push:
    branches:
      - develop
      - feature/github-actions

  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Project Structure
        run: |
          echo "===== ROOT ====="
          ls -la
          echo ""
          echo "===== SRC ====="
          find src -type f

      - name: Download JavaFX SDK
        run: |
          wget https://download2.gluonhq.com/openjfx/26/openjfx-26.0.1_linux-x64_bin-sdk.zip
          unzip openjfx-26.0.1_linux-x64_bin-sdk.zip

      - name: Build Console MVC
        run: |
          mkdir -p out

          javac \
          -encoding UTF-8 \
          -d out \
          $(find src/model -name "*.java") \
          $(find src/util -name "*.java") \
          $(find src/view -name "*.java") \
          $(find src/controller -name "*.java") \
          src/app/Main.java

      - name: Build Success
        run: echo "Build completed successfully."